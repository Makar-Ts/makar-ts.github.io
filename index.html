<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makar-Ts</title>

  <link rel="stylesheet" href="./css/main.css">
  <link rel="shortcut icon" href="./favicon.png" type="image/x-icon">
</head>
<body>
  <div class="main container" flex row gap="20px">
    <img src="" alt="avatar" class="avatar" data-value="user.avatar_url->src">
    <div flex col class="info" gap="5px" grow="1">
      <h2 data-value="user.name->innerText"></h2>
      <p data-value="user.bio->innerText" fsec grow="1" animate-text></p>
      <div flex row gap="10px">
        <a flex row acenter hover data-value="reposLink->href" fmain nounderline gap="3px">
          <span class="mgc_notebook_2_fill"></span>
          <span data-value="user.public_repos->innerText"></span>
        </a>
        <a flex row acenter hover data-value="companyLink->href" fmain nounderline gap="3px">
          <span class="mgc_building_5_fill"></span>
          <span data-value="companyName->innerText"></span>
        </a>
      </div>
    </div>
    <div flex col class="socials" repeat="socials">
      <div flex grow="1" acenter>
        <a flex row gap="3px" acenter fmain nounderline hover data-value="socials.{index}.link->href">
          <span data-value="socials.{index}.spanClass->className"></span>
          <span data-value="socials.{index}.name->innerText"></span>
        </a>
      </div>
    </div>
  </div>

  <div class="container tabs" id="tabs" repeat="tabs">
    <div class="tab" data-value="tabs.{index}.bid->id" flex acenter jcenter hover>
      <span data-value="tabs.{index}.title->innerText"></span>
    </div>
  </div>


  <div flex col id="tab_info">
    <div class="container" flex col gap="5px">
      <p data-value="info.description->innerText"></p>

      <div style="height: 20px;"></div>

      <div class="focuson">
        <span class="mgc_hammer_fill"></span>
        <div data-value="info.job->innerHTML"></div>

        <span class="mgc_search_2_fill"></span>
        <div data-value="info.learning->innerHTML" flex row gap="5px" wrap></div>

        <span class="mgc_check_fill"></span>
        <div data-value="info.confident->innerHTML" flex row gap="5px" wrap></div>
      </div>
      
    </div>
  </div>


  <div flex col id="tab_projects">
    <div class="container tabs projects-subtabs" id="projsubTabs" repeat="projsubTabs">
      <div class="tab small" data-value="projsubTabs.{index}.bid->id" flex acenter jcenter hover>
        <span data-value="projsubTabs.{index}.title->innerText"></span>
      </div>
    </div>

    <div repeat="projsubTabs">
      <div flex col gap="15px" repeat="projects.{index}.repo;rindex" data-value="projsubTabs.{index}.id -> id">
        <a 
          class="container project" 
          flex col gap="20px" 
          

          data-value="projects.{index}.repo.{rindex}.link -> href; projects.{index}.repo.{rindex}.name -> id; projects.{index}.repoClasses.{rindex} -> className"
          role="link" 
          tabindex="0"

          nounderline
          fmain
          target="_blank"
        >
          <div flex col>
            <h2 data-value="projects.{index}.repo.{rindex}.name->innerText"></h2>
            <p data-value="projects.{index}.repo.{rindex}.description->innerText" fsec grow="1"></p>
          </div>

          <div class="topics" repeat="projects.{index}.repo.{rindex}.topics;topic" if="projects.{index}.repo.{rindex}.topics.length">
            <span data-value="projects.{index}.repo.{rindex}.topics.{topic}->innerText"></span>
          </div>

          <div flex row acenter gap="10px" class="footer">
            <div grow="1" class="last-update">Last update: <span data-value="projects.{index}.repo.{rindex}.updated->innerText"></span></div>
            
            <img src="" alt="badge" data-value="projects.{index}.repo.{rindex}.languageBadge->src" class="badge">
          </div>
          
        </a>
      </div>
    </div>
  </div>


  <!-- <div flex col id="tab_skills">
    <div class="container" flex col>
      
    </div>
  </div> -->


  <div class="project-viewer" id="project_viewer">
    <div class="view">
      <h2 id="pv_title"></h2>
      <div class="project-viewer-container" id="project_viewer_container">
        
      </div>
      <button id="pv_close" class="mgc_close_fill" hover></button>
    </div>
  </div>


  <div class="loader">
    <div class="loader-container">

    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
